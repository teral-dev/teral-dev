<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610">
  <defs>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="scanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(37, 99, 235, 0)" />
      <stop offset="50%" stop-color="rgba(37, 99, 235, 0.05)" />
      <stop offset="100%" stop-color="rgba(37, 99, 235, 0)" />
    </linearGradient>
  </defs>

  <rect width="1180" height="610" fill="#F8FAFC" rx="24"/>
  
  <rect width="1180" height="610" fill="url(#glow1)" rx="24">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect width="1180" height="610" fill="url(#glow2)" rx="24">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="8s" repeatCount="indefinite"/>
  </rect>

  <g filter="url(#glass)">
    <rect x="40" y="40" width="1100" height="530" rx="16" fill="#FFFFFF" fill-opacity="0.85" stroke="rgba(15,23,42,0.05)" stroke-width="1.5" />
  </g>

  <circle cx="75" cy="75" r="7" fill="#EF4444" />
  <circle cx="105" cy="75" r="7" fill="#F59E0B" />
  <circle cx="135" cy="75" r="7" fill="#10B981" />
  <line x1="40" y1="110" x2="1140" y2="110" stroke="rgba(15,23,42,0.05)" stroke-width="1" />

  <rect x="40" y="110" width="1100" height="150" fill="url(#scanline)" opacity="0.6" style="pointer-events: none;">
    <animateTransform attributeName="transform" type="translate" values="0,-150; 0,530" dur="6s" repeatCount="indefinite" />
  </rect>

  <text x="80" y="170" font-family="-apple-system, sans-serif" font-size="38" font-weight="800" fill="#0F172A">Hi 👋, I'm <tspan fill="url(#textGrad)">Mehmet Emin</tspan></text>
  
  <g transform="translate(80, 200)" font-family="monospace" font-size="20" fill="#2563EB">
