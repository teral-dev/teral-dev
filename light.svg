  </g>

  <g transform="translate(80, 270)" font-family="monospace" font-size="16" fill="#475569">
      <text y="0">Location  : <tspan fill="#0F172A">İnegöl, Bursa, Türkiye 🇹🇷</tspan></text>
    <text y="35">Education : <tspan fill="#0F172A">Sehit Fevzi Basaran AIHL 12th grader. 🎓</tspan></text>
    <text y="70">Email     : <tspan fill="#10B981">mehmeteminkartal5433@gmail.com ✉️</tspan></text>
    <text y="105">Discord   : <tspan fill="#0F172A">@krtll_fmu</tspan></text>
    <text y="140">Instagram : <tspan fill="#0F172A">@leoeminn_</tspan></text>
