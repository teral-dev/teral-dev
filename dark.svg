<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <!-- Glassmorphism Panel Filter -->
    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <!-- Scanline Effect -->
    <linearGradient id="scanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(34, 211, 238, 0)" />
      <stop offset="50%" stop-color="rgba(34, 211, 238, 0.08)" />
      <stop offset="100%" stop-color="rgba(34, 211, 238, 0)" />
    </linearGradient>
    
    <clipPath id="typingClip">
      <rect x="0" y="0" width="0" height="50">
        <animate attributeName="width" values="0; 400; 400" keyTimes="0; 0.5; 1" dur="4s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- Base Dark Background -->
  <rect width="1180" height="610" fill="#030712" rx="24"/>
  
  <!-- Floating Radial Glows -->
  <rect width="1180" height="610" fill="url(#glow1)" rx="24">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect width="1180" height="610" fill="url(#glow2)" rx="24">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Main Terminal Glass Panel -->
  <g filter="url(#glass)">
    <rect x="40" y="40" width="1100" height="530" rx="16" fill="#0F172A" fill-opacity="0.75" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  </g>

  <!-- macOS Window Dots -->
  <circle cx="75" cy="75" r="7" fill="#EF4444" />
  <circle cx="105" cy="75" r="7" fill="#F59E0B" />
  <circle cx="135" cy="75" r="7" fill="#10B981" />
  <line x1="40" y1="110" x2="1140" y2="110" stroke="rgba(255,255,255,0.05)" stroke-width="1" />

  <!-- Animated Scanline -->
  <rect x="40" y="110" width="1100" height="150" fill="url(#scanline)" opacity="0.6" style="pointer-events: none;">
    <animateTransform attributeName="transform" type="translate" values="0,-150; 0,530" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- ================= LEFT SIDE (INFO & SOCIALS) ================= -->
  
  <text x="80" y="170" font-family="-apple-system, sans-serif" font-size="38" font-weight="800" fill="#F8FAFC">Hi 👋, I'm <tspan fill="url(#textGrad)">Mehmet Emin</tspan></text>
  
  <!-- Typing Subtitle -->
  <g transform="translate(80, 200)" font-family="monospace" font-size="20" fill="#22D3EE">
    <text>> Game &amp; App Developer</text>
    <rect x="250" y="-18" width="10" height="22" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Details / Info List -->
  <g transform="translate(80, 270)" font-family="monospace" font-size="16" fill="#94A3B8">
    <text y="0">Location  : <tspan fill="#F8FAFC">İnegöl, Bursa, Türkiye 🇹🇷</tspan></text>
    <text y="35">Education : <tspan fill="#F8FAFC">Sehit Fevzi Basaran AIHL 12th grader.</tspan></text>
    <text y="70">Email     : <tspan fill="#10B981">mehmeteminkartal5433@gmail.com </tspan></text>
    <text y="105">Discord   : <tspan fill="#F8FAFC">@krtll_fmu</tspan></text>
    <text y="140">Instagram : <tspan fill="#F8FAFC">@leoeminn_</tspan></text>
    <text y="175">YouTube   : <tspan fill="#EF4444">@teraldev</tspan></text>
    <text y="210">Itch.io   : <tspan fill="#22D3EE">teral_dev</tspan></text>
  </g>

  <!-- Divider Line -->
  <line x1="570" y1="130" x2="570" y2="540" stroke="rgba(255,255,255,0.05)" stroke-width="2" stroke-dasharray="4" />

  <!-- ================= RIGHT SIDE (SKILLS & FACTS) ================= -->
  
  <!-- Skills Section -->
  <g transform="translate(620, 160)">
    <text font-family="monospace" font-size="16" fill="#94A3B8">> system.load_skills()</text>
    
    <g transform="translate(0, 30)" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#F8FAFC">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <rect width="90" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" />
        <text x="45" y="23" text-anchor="middle">Android</text>
      </g>
      <g transform="translate(105, 0)">
        <rect width="60" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" />
        <text x="30" y="23" text-anchor="middle">C#</text>
      </g>
      
      <!-- Row 2 -->
      <g transform="translate(0, 50)">
        <rect width="80" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" />
        <text x="40" y="23" text-anchor="middle">Unity</text>
      </g>
      <g transform="translate(95, 50)">
        <rect width="90" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" />
        <text x="45" y="23" text-anchor="middle">VSCode</text>
      </g>
      <g transform="translate(200, 50)">
        <rect width="90" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" />
        <text x="45" y="23" text-anchor="middle">Flutter</text>
      </g>
    </g>
  </g>

  <!-- Fun Facts Section -->
  <g transform="translate(620, 340)">
    <text font-family="monospace" font-size="16" fill="#22D3EE">> ./run_fun_facts.sh</text>
    <text font-family="monospace" font-size="14" fill="#94A3B8" y="25">[INFO] Fetching user profile data...</text>

    <!-- Animated Rotating Text Container -->
    <g font-family="-apple-system, sans-serif" font-size="16" font-weight="500" fill="#F8FAFC" transform="translate(0, 70)">
      
      <!-- Fact 1 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0; 0.05; 0.15; 0.2; 1" dur="20s" repeatCount="indefinite" />
        <rect x="0" y="-25" width="420" height="44" rx="6" fill="rgba(34, 211, 238, 0.05)" stroke="rgba(34, 211, 238, 0.2)" />
        <text x="15" y="3">Huge Fan of Motorsports</text>
      </g>
      
      <!-- Fact 2 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0; 0.2; 0.25; 0.35; 0.4; 1" dur="20s" repeatCount="indefinite" />
        <rect x="0" y="-25" width="420" height="44" rx="6" fill="rgba(16, 185, 129, 0.05)" stroke="rgba(16, 185, 129, 0.2)" />
        <text x="15" y="3">Coding on a 10th Gen i3 with 4GB RAM!</text>
      </g>
      
      <!-- Fact 3 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0; 0.4; 0.45; 0.55; 0.6; 1" dur="20s" repeatCount="indefinite" />
        <rect x="0" y="-25" width="420" height="44" rx="6" fill="rgba(139, 92, 246, 0.05)" stroke="rgba(139, 92, 246, 0.2)" />
        <text x="15" y="3">Listening to Kanye West everyday</text>
      </g>
      
      <!-- Fact 4 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0; 0.6; 0.65; 0.75; 0.8; 1" dur="20s" repeatCount="indefinite" />
        <rect x="0" y="-25" width="420" height="44" rx="6" fill="rgba(244, 63, 94, 0.05)" stroke="rgba(244, 63, 94, 0.2)" />
        <text x="15" y="3">My favorite game is Mafia II!</text>
      </g>
      
      <!-- Fact 5 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0; 0.8; 0.85; 0.95; 1" dur="20s" repeatCount="indefinite" />
        <rect x="0" y="-25" width="420" height="44" rx="6" fill="rgba(245, 158, 11, 0.05)" stroke="rgba(245, 158, 11, 0.2)" />
        <text x="15" y="3">Biggest Messi fan ever lived"</text>
      </g>

    </g>
  </g>
</svg>
